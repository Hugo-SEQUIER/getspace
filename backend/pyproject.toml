[project]
name = "space-backend"
version = "0.3.0"
description = "Self-hosted REST and MCP backend for Space"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "cryptography>=46,<52",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "mcp>=1.28,<2",
  "psycopg-pool>=3.2,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "rank-bm25==0.2.2",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pyjwt[crypto]>=2.10,<3", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/space"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Preserve pinned upstream prompt wording and documentation.
"src/space/_vendor/memora/**" = ["E501"]
